<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIGIA — Operación y jornadas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"></head><body data-protect-demo="true"><div class="bg-photo"></div><canvas id="bgCanvas"></canvas><div class="app"><aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside><div class="main"><div class="content"><div class="page"><div class="page-head"><div><span class="mono-tag">TURNOS Y TIEMPOS</span><h1>Operación de garita</h1><p>Programa jornadas, registra relevos y conserva siempre el nombre del guardia original de cada acceso o incidencia.</p></div><button class="btn btn-ghost" id="reloadOps"><i class="bi bi-arrow-clockwise"></i> Actualizar</button></div><div class="metric-grid"><div class="metric-card"><span class="metric-value" id="activeShifts">0</span><span class="metric-label">Turnos activos</span></div><div class="metric-card"><span class="metric-value" id="waitingQueue">0</span><span class="metric-label">Personas esperando</span></div><div class="metric-card"><span class="metric-value" id="avgAccess">0 s</span><span class="metric-label">Promedio de atención</span></div><div class="metric-card"><span class="metric-value" id="timeZone">HN</span><span class="metric-label">Zona horaria</span></div></div><div class="split-layout"><div class="panel"><div class="panel-head"><h3>Programar jornada</h3><span class="badge info">ADMIN</span></div><form id="shiftForm" class="form-grid"><div class="form-group span-2" id="opResidentialGroup"><label>Residencial</label><select id="opResidential" class="form-control"></select></div><div class="form-group span-2"><label>Guardia original</label><select id="opGuard" class="form-control" required></select></div><div class="form-group"><label>Punto de acceso</label><select id="opPoint" class="form-control"></select></div><div class="form-group"><label>Guardia de relevo opcional</label><select id="opRelief" class="form-control"><option value="">Sin relevo</option></select></div><div class="form-group"><label>Inicio</label><input id="opStart" class="form-control" type="datetime-local" required></div><div class="form-group"><label>Fin</label><input id="opEnd" class="form-control" type="datetime-local" required></div><div class="form-group span-2"><label>Observaciones</label><input id="opNotes" class="form-control" maxlength="255"></div><button class="btn btn-solid span-2" type="submit">Programar turno</button></form></div><div class="panel"><div class="panel-head"><h3>Jornadas y relevos</h3><span class="mono" id="shiftCount"></span></div><div id="shiftList" class="queue-list"></div></div></div></div></div></div></div><script src="js/common.js"></script><script src="js/operaciones.js"></script></body></html>
