<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIGIA — Personas autorizadas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"></head><body data-protect-demo="true"><div class="bg-photo"></div><canvas id="bgCanvas"></canvas><div class="app"><aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside><div class="main"><div class="content"><div class="page"><div class="page-head"><div><span class="mono-tag">ACCESO RECURRENTE</span><h1>Personas autorizadas</h1><p>Registra buses escolares, familiares, personal doméstico, proveedores y transportes con días y horarios definidos.</p></div><button class="btn btn-solid" id="newAuthorized"><i class="bi bi-person-plus-fill"></i> Nueva autorización</button></div><div class="split-layout"><div class="panel"><div class="panel-head"><h3>Registro rápido</h3><span class="badge info">HORARIO</span></div><form id="authorizedForm" class="form-grid"><div class="form-group span-2"><label>Nombre completo</label><input class="form-control" id="auName" maxlength="180" required></div><div class="form-group"><label>Tipo</label><select class="form-control" id="auType"><option value="bus_escolar">Bus escolar</option><option value="familiar">Familiar</option><option value="servicio_domestico">Servicio doméstico</option><option value="proveedor">Proveedor</option><option value="transporte">Transporte</option><option value="otro">Otro</option></select></div><div class="form-group"><label>Documento</label><input class="form-control" id="auDocument" maxlength="50"></div><div class="form-group"><label>Empresa</label><input class="form-control" id="auCompany" maxlength="120"></div><div class="form-group"><label>Placa</label><input class="form-control" id="auPlate" maxlength="20"></div><div class="form-group"><label>Desde</label><select class="form-control" id="auFrom"></select></div><div class="form-group"><label>Hasta</label><select class="form-control" id="auTo"></select></div><div class="form-group span-2"><label>Días permitidos</label><p class="config-section-note" style="margin:.1rem 0 .5rem">Si no marcás ninguno, se permite todos los días.</p><div class="day-selector" id="auDays"><label title="Lunes"><input type="checkbox" value="1"><span>Lu</span></label><label title="Martes"><input type="checkbox" value="2"><span>Ma</span></label><label title="Miércoles"><input type="checkbox" value="3"><span>Mi</span></label><label title="Jueves"><input type="checkbox" value="4"><span>Ju</span></label><label title="Viernes"><input type="checkbox" value="5"><span>Vi</span></label><label title="Sábado"><input type="checkbox" value="6"><span>Sá</span></label><label title="Domingo"><input type="checkbox" value="0"><span>Do</span></label></div></div><div class="form-group span-2"><label>Fotografía opcional</label><input class="form-control" id="auPhoto" type="file" accept="image/*" capture="environment"></div><button class="btn btn-solid span-2" type="submit"><i class="bi bi-check-lg"></i> Guardar autorización</button></form></div><div class="panel"><div class="panel-head"><h3>Autorizaciones activas</h3><button class="btn btn-ghost" id="reloadAuthorized"><i class="bi bi-arrow-clockwise"></i></button></div><div id="authorizedList" class="queue-list"><div class="empty-state">Cargando...</div></div></div></div></div></div></div></div><script src="js/common.js"></script><script src="js/autorizados.js"></script></body></html>
