<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Perfil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV ============ -->
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-head">
          <div><span class="mono-tag">PERFIL</span><h1 class="mt-2">Tu perfil</h1><p>Así te ven los guardias y la administración.</p></div>
        </div>
        <div class="profile-card">
          <div class="profile-cover">
            <div class="glow"></div>
            <span class="verified-chip"><i class="bi bi-patch-check-fill"></i> VERIFICADO</span>
          </div>
          <div class="profile-body">
            <div class="profile-avatar" id="pfAvatar">VG</div>
            <h2 id="pfNombre">Cargando…</h2>
            <div class="role" id="pfRol">&nbsp;</div>
            <div class="loc"><i class="bi bi-geo-alt-fill"></i> <span id="pfUbicacion">Cargando…</span></div>
            <div class="profile-stats">
              <div><b id="pfStatVisitas">—</b><span>Visitas registradas</span></div>
              <div><b id="pfStatAccesos">—</b><span>Accesos registrados</span></div>
              <div><b id="pfStatVehiculos">—</b><span>Vehículos registrados</span></div>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Información de contacto</h3><div style="display:flex;gap:1rem;"><a href="#" id="cancelEditBtn" style="display:none;color:var(--mist);">CANCELAR</a><a href="#" id="editProfileBtn">EDITAR</a></div></div>
          <div class="info-grid">
            <div class="info-field"><label>Nombre</label><div class="v" id="pfNombreField" data-field="nombre">—</div></div>
            <div class="info-field"><label>Apellido</label><div class="v" id="pfApellidoField" data-field="apellido">—</div></div>
            <div class="info-field"><label>Correo electrónico</label><div class="v" id="pfEmailField" data-field="email">—</div></div>
            <div class="info-field"><label>Teléfono</label><div class="v" id="pfTelefonoField" data-field="telefono">—</div></div>
            <div class="info-field"><label>Unidad</label><div class="v" id="pfUnidadField">—</div></div>
            <div class="info-field"><label>Residencial</label><div class="v" id="pfResidencialField">—</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
