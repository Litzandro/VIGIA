<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Comunidad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV ============ -->
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-banner">
          <div class="page-banner-bg" style="background-image:url('https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=1400&auto=format&fit=crop');"></div>
          <div class="page-banner-glow"></div>
          <div class="page-banner-content">
            <div><span class="mono-tag">COMUNIDAD</span><h1>Muro de vecinos</h1><p>Comparte avisos, objetos perdidos o mensajes con los demás residentes de tu torre.</p></div>
          </div>
        </div>

        <div class="panel">
          <form id="postForm" novalidate>
            <div class="form-group">
              <label for="postText">¿Qué quieres compartir?</label>
              <textarea class="form-control" id="postText" maxlength="300" rows="4" placeholder="Escribe un mensaje breve..." required></textarea><div class="field-help"><span id="postCount">0/300</span><span>Máximo 4 líneas</span></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
              <select class="form-control" id="postCategory" style="max-width:220px;">
                <option value="General">General</option>
                <option value="Objetos perdidos">Objetos perdidos</option>
                <option value="Compra-venta">Compra-venta</option>
                <option value="Aviso importante">Aviso importante</option>
              </select>
              <label class="privacy-check" style="margin:0;flex:1;max-width:260px"><input type="checkbox" id="postPrivate"><span><b>Publicación privada</b><small>Solo administración podrá verla</small></span></label><button type="submit" class="btn btn-solid"><i class="bi bi-send-fill"></i> Publicar</button>
            </div>
          </form>
        </div>

        <div id="postsFeed" style="margin-top:1.6rem;display:flex;flex-direction:column;gap:1.1rem;">
          <div class="empty-state">Cargando…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/comunidad.js"></script>
</body>
</html>
