<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Mis visitas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV ============ -->
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-banner">
          <div class="page-banner-bg" style="background-image:url('https://images.unsplash.com/photo-1516156008625-3a9d6067fab5?q=80&w=1400&auto=format&fit=crop');"></div>
          <div class="page-banner-glow"></div>
          <div class="page-banner-content">
            <div><span class="mono-tag">MIS VISITAS</span><h1>Agenda de visitas</h1><p>Autoriza y da seguimiento a quién entra a tu hogar.</p></div>
            <button type="button" class="btn btn-solid" data-open-visit><i class="bi bi-plus-lg"></i> Nueva visita</button>
          </div>
        </div>
        <div class="agenda-toolbar">
          <div class="agenda-tabs" id="agendaTabs">
            <button class="active">Próximas</button>
            <button>Historial</button>
            <button>Recurrentes</button>
          </div>
          <div class="view-switch" id="viewSwitch">
            <button type="button" class="active" data-view="lista"><i class="bi bi-list-ul"></i> Lista</button>
            <button type="button" data-view="calendario"><i class="bi bi-calendar3"></i> Calendario</button>
          </div>
        </div>
        <div id="listaView">
          <p class="mono" id="visitEmptyMsg" style="color:var(--mist);font-size:.85rem;padding:2rem 0;text-align:center;">Cargando…</p>
        </div>
        <div id="calendarioView" class="month-cal" hidden>
          <div class="month-cal-toolbar">
            <div class="month-cal-nav">
              <button type="button" class="icon-btn" id="monthPrev" title="Mes anterior"><i class="bi bi-chevron-left"></i></button>
              <span class="month-cal-label" id="monthLabel">—</span>
              <button type="button" class="icon-btn" id="monthNext" title="Mes siguiente"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div class="month-cal-toolbar-right">
              <div class="view-switch" id="heatSwitch">
                <button type="button" class="active" data-heat="off"><i class="bi bi-grid-3x3-gap"></i> Normal</button>
                <button type="button" data-heat="on"><i class="bi bi-fire"></i> Mapa de calor</button>
              </div>
              <button type="button" class="btn btn-ghost month-cal-todaybtn" id="monthToday">Hoy</button>
            </div>
          </div>
          <div class="month-cal-layout">
            <aside class="month-cal-filters" id="monthFilters">
              <div class="mcf-group">
                <b>Categoría</b>
                <label class="mcf-check"><input type="checkbox" data-cat-filter="familiar" checked><span class="mcf-dot" style="--dot-color:#12E8A0"></span>Familiar</label>
                <label class="mcf-check"><input type="checkbox" data-cat-filter="entrega" checked><span class="mcf-dot" style="--dot-color:#579AFF"></span>Entrega</label>
                <label class="mcf-check"><input type="checkbox" data-cat-filter="mantenimiento" checked><span class="mcf-dot" style="--dot-color:#F0B43C"></span>Servicio técnico</label>
                <label class="mcf-check"><input type="checkbox" data-cat-filter="otro" checked><span class="mcf-dot" style="--dot-color:#B98AFF"></span>Otro</label>
              </div>
              <div class="mcf-group">
                <b>Estado</b>
                <label class="mcf-check"><input type="checkbox" data-estado-filter="pendiente" checked>Pendiente</label>
                <label class="mcf-check"><input type="checkbox" data-estado-filter="usada" checked>Utilizada</label>
                <label class="mcf-check"><input type="checkbox" data-estado-filter="cancelada" checked>Cancelada</label>
                <label class="mcf-check"><input type="checkbox" data-estado-filter="expirada" checked>Expirada</label>
              </div>
            </aside>
            <div class="month-cal-frame">
              <div class="month-cal-headrow">
                <span class="mc-gutter"></span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
              </div>
              <div class="month-cal-grid" id="monthGrid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="newVisitModal">
  <div class="modal-box form-modal" id="newVisitModalBox">
    <div class="modal-icon"><i class="bi bi-person-badge-fill"></i></div>
    <h3>Nueva visita</h3>
    <p>Autoriza el ingreso de alguien a tu unidad.</p>
    <form id="newVisitForm" novalidate>
      <div class="form-group">
        <label>Acceso rápido</label>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost quick-reason" data-reason="Visita familiar" style="padding:.4rem .8rem;font-size:.78rem;">Familiar</button>
          <button type="button" class="btn btn-ghost quick-reason" data-reason="Entrega" style="padding:.4rem .8rem;font-size:.78rem;">Delivery</button>
          <button type="button" class="btn btn-ghost quick-reason" data-reason="Mantenimiento" style="padding:.4rem .8rem;font-size:.78rem;">Servicio técnico</button>
        </div>
      </div>
      <div class="form-group">
        <label for="visitName">Nombre del visitante</label>
        <input type="text" class="form-control" id="visitName" placeholder="Ej. Ana Martínez" required>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;text-transform:none;font-family:var(--f-body);font-size:.83rem;color:var(--bone);">
          <input type="checkbox" id="visitNow" style="width:auto;accent-color:var(--accent);">
          Ingreso inmediato (ahora mismo) — útil si hay fila esperando
        </label>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;text-transform:none;font-family:var(--f-body);font-size:.83rem;color:var(--bone);">
          <input type="checkbox" id="visitRecurring" style="width:auto;accent-color:var(--accent);">
          Es una visita recurrente (ej. bus escolar, servicio de limpieza)
        </label>
      </div>
      <div class="form-group" id="visitFrequencyGroup" style="display:none;">
        <label for="visitFrequency">Frecuencia</label>
        <select class="form-control" id="visitFrequency">
          <option value="Diario">Diario</option>
          <option value="Semanal">Semanal</option>
          <option value="Mensual">Mensual</option>
        </select>
      </div>
      <div class="form-group" id="visitDateTimeGroup" style="display:flex;gap:.8rem;">
        <div style="flex:1;">
          <label for="visitDate">Fecha</label>
          <input type="date" class="form-control" id="visitDate" required>
        </div>
        <div style="flex:1;">
          <label for="visitTime">Hora</label>
          <input type="time" class="form-control" id="visitTime" required>
        </div>
      </div>
      <div class="form-group">
        <label for="visitReason">Motivo</label>
        <select class="form-control" id="visitReason">
          <option value="Visita familiar">Visita familiar</option>
          <option value="Entrega">Entrega</option>
          <option value="Mantenimiento">Mantenimiento</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Color en el calendario</label>
        <div class="color-swatch-row" id="visitColorSwatches">
          <button type="button" class="color-swatch active" data-color="#12E8A0" style="background:#12E8A0" title="Verde menta"></button>
          <button type="button" class="color-swatch" data-color="#579AFF" style="background:#579AFF" title="Azul"></button>
          <button type="button" class="color-swatch" data-color="#F0B43C" style="background:#F0B43C" title="Ámbar"></button>
          <button type="button" class="color-swatch" data-color="#FF7B72" style="background:#FF7B72" title="Coral"></button>
          <button type="button" class="color-swatch" data-color="#B98AFF" style="background:#B98AFF" title="Violeta"></button>
          <button type="button" class="color-swatch" data-color="#FF8AC4" style="background:#FF8AC4" title="Rosa"></button>
          <label class="color-swatch-custom" title="Elegir otro color">
            <input type="color" id="visitColorCustom" value="#12E8A0">
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="newVisitCancel">Cancelar</button>
        <button type="submit" class="btn btn-solid"><i class="bi bi-check-lg"></i> Agendar visita</button>
      </div>
    </form>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/visitas.js"></script>
</body>
</html>
