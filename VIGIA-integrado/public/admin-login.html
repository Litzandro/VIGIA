<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Portal de administración</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="auth-page">
  <div class="auth-card">
    <a href="vigialanding.html" class="auth-logo">
      <span class="mark bracket"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span><i class="bi bi-shield-lock-fill"></i></span>
      VIGIA <span class="mono" style="font-size:.62rem;color:var(--mist);margin-left:.4rem;letter-spacing:.08em;">ADMINISTRACIÓN</span>
    </a>
    <h1>Portal de administración</h1>
    <p class="auth-sub">Inicia sesión para gestionar usuarios, residenciales y suscripciones.</p>

    <div class="auth-error" id="adminLoginError"><i class="bi bi-exclamation-circle-fill"></i><span></span></div>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label for="adminLoginEmail">Correo electrónico</label>
        <input type="email" class="form-control" id="adminLoginEmail" placeholder="tu@vigia.com" required>
      </div>
      <div class="form-group">
        <label for="adminLoginPassword">Contraseña</label>
        <div class="password-field">
          <input type="password" class="form-control" id="adminLoginPassword" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="toggleAdminLoginPassword" tabindex="-1"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;" id="adminLoginSubmitBtn">
        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
      </button>
    </form>

    <div class="auth-divider">o</div>
    <a href="login.html" class="btn btn-ghost" style="width:100%;justify-content:center;"><i class="bi bi-person-fill"></i> Soy residente</a>
    <a href="guardia-login.html" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:.6rem;"><i class="bi bi-shield-fill-exclamation"></i> Soy guardia</a>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/admin-auth-store.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
