<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIGIA — Vetos de acceso</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"></head><body data-protect-demo="true"><div class="bg-photo"></div><canvas id="bgCanvas"></canvas><div class="app"><aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside><div class="main"><div class="content"><div class="page"><div class="page-head"><div><span class="mono-tag">PROTECCIÓN Y CONFLICTOS</span><h1>Vetos de acceso</h1><p>Solicita bloquear a una persona. Administración valida el caso y garita recibe la alerta automáticamente.</p></div></div><div class="split-layout"><div class="panel"><div class="panel-head"><h3>Nueva solicitud</h3><span class="badge alert">REQUIERE REVISIÓN</span></div><form id="vetoForm" class="form-grid"><div class="form-group span-2"><label>Nombre de la persona</label><input id="veName" class="form-control" maxlength="180" required></div><div class="form-group"><label>Documento</label><input id="veDocument" class="form-control" maxlength="50"></div><div class="form-group"><label>Teléfono</label><input id="vePhone" class="form-control" maxlength="30"></div><div class="form-group span-2"><label>Motivo</label><textarea id="veReason" class="form-control" maxlength="255" rows="4" required></textarea><small class="char-counter" id="veCounter">0/255</small></div><div class="form-group span-2"><label>Evidencia opcional</label><input id="vePhoto" class="form-control" type="file" accept="image/*" capture="environment"></div><button class="btn btn-alert span-2" type="submit"><i class="bi bi-shield-x"></i> Enviar solicitud</button></form></div><div class="panel"><div class="panel-head"><h3>Mis solicitudes</h3><button class="btn btn-ghost" id="reloadVetos"><i class="bi bi-arrow-clockwise"></i></button></div><div id="vetoList" class="queue-list"><div class="empty-state">Cargando...</div></div></div></div></div></div></div></div><script src="js/common.js"></script><script src="js/vetos.js"></script></body></html>
