<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Notificaciones</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV ============ -->
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-banner">
          <div class="page-banner-bg" style="background-image:url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1400&auto=format&fit=crop');"></div>
          <div class="page-banner-glow"></div>
          <div class="page-banner-content">
            <div><span class="mono-tag">NOTIFICACIONES</span><h1>Centro de notificaciones</h1><p>Todo lo que necesitas saber, en un solo lugar.</p></div>
            <button type="button" class="btn btn-ghost" id="markAllRead"><i class="bi bi-check2-all"></i> Marcar todo leído</button>
          </div>
        </div>
        <div class="filter-chips" style="margin-bottom:1rem;">
          <button type="button" class="filter-chip active" data-filter="todas">Todas</button>
          <button type="button" class="filter-chip" data-filter="no-leidas">No leídas</button>
        </div>
        <div class="panel" id="notifList">
          <div class="empty-state">Cargando…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/notificaciones.js"></script>
</body>
</html>
