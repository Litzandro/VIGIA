<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Nueva contraseña</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="auth-page">
  <div class="auth-card" style="max-width:440px;">
    <a href="vigialanding.html" class="auth-logo">
      <span class="mark bracket"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span><i class="bi bi-shield-lock-fill"></i></span>
      VIGIA
    </a>
    <h1>Crea una contraseña nueva</h1>
    <p class="auth-sub">Debe tener al menos 8 caracteres, con mayúscula, minúscula y número.</p>

    <div class="auth-error" id="resetError"><i class="bi bi-exclamation-circle-fill"></i><span></span></div>
    <div class="auth-success" id="resetSuccess"><i class="bi bi-check-circle-fill"></i><span></span></div>

    <form id="resetForm" novalidate autocomplete="off">
      <div class="form-group">
        <label for="resetPassword">Contraseña nueva</label>
        <div class="password-field">
          <input type="password" class="form-control" id="resetPassword" name="new-password" autocomplete="new-password" placeholder="Crea tu contraseña" required>
          <button type="button" class="toggle-password" id="toggleResetPassword" tabindex="-1"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="resetPasswordConfirm">Confirma la contraseña</label>
        <input type="password" class="form-control" id="resetPasswordConfirm" name="new-password-confirm" autocomplete="new-password" placeholder="Repite tu contraseña" required>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;" id="resetSubmitBtn">
        <i class="bi bi-check-lg"></i> Guardar contraseña
      </button>
    </form>

    <div class="auth-footer-link"><a href="login.html"><i class="bi bi-arrow-left"></i> Volver a iniciar sesión</a></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/restablecer-password.js"></script>
</body>
</html>
