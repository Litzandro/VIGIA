<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Crear cuenta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <a href="vigialanding.html" class="auth-logo">
      <span class="mark bracket"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span><i class="bi bi-shield-lock-fill"></i></span>
      VIGIA
    </a>
    <h1>Crea tu cuenta</h1>
    <p class="auth-sub">Regístrate como residente para gestionar tus visitas, accesos e incidencias.</p>

    <div class="auth-error" id="registerError"><i class="bi bi-exclamation-circle-fill"></i><span></span></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="regName">Nombre completo</label>
        <input type="text" class="form-control" id="regName" placeholder="Ej. Ana Martínez" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Correo electrónico</label>
        <input type="email" class="form-control" id="regEmail" placeholder="tu@correo.com" required>
      </div>
      <div class="auth-row">
        <div class="form-group">
          <label for="regPhone">Teléfono</label>
          <input type="tel" class="form-control" id="regPhone" placeholder="9999-0000" required>
        </div>
        <div class="form-group">
          <label for="regUnidad">Unidad</label>
          <input type="text" class="form-control" id="regUnidad" placeholder="Torre B · Depto 402" required>
        </div>
      </div>
      <div class="form-group">
        <label for="regColonia">Colonia / residencial</label>
        <select class="form-control" id="regColonia">
          <option value="Altavista Residencial">Altavista Residencial</option>
        </select>
      </div>
      <div class="auth-row">
        <div class="form-group">
          <label for="regPassword">Contraseña</label>
          <div class="password-field">
            <input type="password" class="form-control" id="regPassword" placeholder="Crea tu contraseña" required>
            <button type="button" class="toggle-password" id="toggleRegPassword" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label for="regPasswordConfirm">Confirmar contraseña</label>
          <input type="password" class="form-control" id="regPasswordConfirm" placeholder="Repite tu contraseña" required>
        </div>
      </div>
      <p class="field-hint">Mínimo 8 caracteres, con al menos una mayúscula, una minúscula y un número.</p>
      <label class="auth-check">
        <input type="checkbox" id="acceptTerms" required>
        Acepto los términos de uso y el aviso de privacidad de VIGIA.
      </label>
      <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;" id="registerSubmitBtn">
        <i class="bi bi-person-plus-fill"></i> Crear cuenta
      </button>
    </form>

    <div class="auth-footer-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/auth-store.js"></script>
<script src="js/register.js"></script>
</body>
</html>
