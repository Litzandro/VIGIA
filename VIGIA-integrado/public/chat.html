<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Comunicación con seguridad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV ============ -->
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-banner">
          <div class="page-banner-bg" style="background-image:url('https://images.unsplash.com/photo-1521791136064-7986c2920216?q=80&w=1400&auto=format&fit=crop');"></div>
          <div class="page-banner-glow"></div>
          <div class="page-banner-content">
            <div><span class="mono-tag">COMUNICACIÓN SEGURA</span><h1>Chat con seguridad</h1><p>Mensajes persistentes con el guardia o la administración. El filtro local evita spam y resalta posibles emergencias.</p></div>
          </div>
        </div>

        <div class="panel chat-panel">
          <div class="chat-header">
            <div class="post-av" id="chatStaffAvatar">VG</div>
            <div class="post-who"><b id="chatStaffName">Seguridad VIGIA</b><span class="mono"><span class="chat-status-dot"></span> Guardia o administración disponible</span></div>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <form id="chatForm" class="chat-input-row" autocomplete="off">
            <input type="text" class="form-control" id="chatInput" maxlength="500" placeholder="Escribe un mensaje (máximo 500 caracteres)..." aria-describedby="chatHelp">
            <span class="chat-char-count mono" id="chatCharCount">0/500</span>
            <button type="submit" class="btn btn-solid" id="chatSendBtn"><i class="bi bi-send-fill"></i></button>
          </form>
          <div id="chatHelp" class="config-section-note" style="padding:.35rem 1rem 1rem">Máximo 4 líneas y 2 enlaces. Los mensajes quedan registrados para trazabilidad.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
