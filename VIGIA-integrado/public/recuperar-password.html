<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Recuperar contraseña</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="auth-page">
  <div class="auth-card" style="max-width:440px;">
    <a href="vigialanding.html" class="auth-logo">
      <span class="mark bracket"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span><i class="bi bi-shield-lock-fill"></i></span>
      VIGIA
    </a>
    <h1>Recupera tu contraseña</h1>
    <p class="auth-sub">Escribe el correo de tu cuenta y te mandamos un enlace para crear una contraseña nueva.</p>

    <div class="auth-error" id="forgotError"><i class="bi bi-exclamation-circle-fill"></i><span></span></div>
    <div class="auth-success" id="forgotSuccess"><i class="bi bi-check-circle-fill"></i><span></span></div>

    <form id="forgotForm" novalidate autocomplete="on">
      <div class="form-group">
        <label for="forgotEmail">Correo electrónico</label>
        <input type="email" class="form-control" id="forgotEmail" name="email" autocomplete="username" placeholder="tu@correo.com" required>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;" id="forgotSubmitBtn">
        <i class="bi bi-envelope-fill"></i> Enviar enlace
      </button>
    </form>

    <div class="auth-footer-link"><a href="login.html"><i class="bi bi-arrow-left"></i> Volver a iniciar sesión</a></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/recuperar-password.js"></script>
</body>
</html>
