<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIA — Portal del guardia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-photo"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <!-- ============ TOP NAV (portal separado de residentes y superadmin) ============ -->
  <aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside><!-- ============ MAIN ============ -->
  <div class="main">
    <div class="content">
      <div class="page">
        <div class="page-banner">
          <div class="page-banner-bg" style="background-image:url('https://images.unsplash.com/photo-1517457373958-b7bdd4587205?q=80&w=1400&auto=format&fit=crop');"></div>
          <div class="page-banner-glow"></div>
          <div class="page-banner-content">
            <div><span class="mono-tag">PORTAL DEL GUARDIA</span><h1>Alertas y comunicación con residentes</h1><p id="guardShiftLine">Turno · Altavista Residencial</p></div>
          </div>
        </div>

        <div class="admin-stats">
          <div class="admin-stat" id="statPendientesWrap"><span class="val" id="statPendientes">0</span><span class="lbl">Pendientes</span></div>
          <div class="admin-stat"><span class="val" id="statFalsas">0</span><span class="lbl">Falsas alarmas</span></div>
          <div class="admin-stat"><span class="val" id="statAtendidas">0</span><span class="lbl">Atendidas hoy</span></div>
        </div>

        <div class="incidencias-toolbar">
          <h3 style="margin:0;">Alertas de pánico</h3>
          <a href="mensajeria.html" class="btn btn-ghost"><i class="bi bi-chat-dots-fill"></i> Ir a Mensajería</a>
        </div>

        <div class="panel">
          <div id="guardPanicList"></div>
          <p class="mono" id="guardPanicEmptyMsg" style="color:var(--mist);font-size:.85rem;padding:1.5rem 0;text-align:center;">Aún no se ha activado ninguna alerta de pánico.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/guard-auth-store.js"></script>
<script src="js/guardia.js"></script>
</body>
</html>
