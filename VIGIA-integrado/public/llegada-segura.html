<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIGIA — Llegada segura</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"></head><body data-protect-demo="true"><div class="bg-photo"></div><canvas id="bgCanvas"></canvas><div class="app"><aside class="sidebar" id="vigiaSidebar" aria-label="Navegación de VIGIA"></aside><div class="main"><div class="content"><div class="page"><div class="page-head"><div><span class="mono-tag">ACOMPAÑAMIENTO DE LLEGADA</span><h1>Llegada segura</h1><p>Avisa que vienes en camino. VIGIA conserva el seguimiento hasta que confirmes tu llegada.</p></div></div><div class="split-layout"><div class="panel"><div class="panel-head"><h3>Estoy llegando</h3><span class="badge info">RESIDENTE</span></div><form id="arrivalForm" class="form-grid"><div class="form-group span-2"><label>¿Desde dónde vienes?</label><input id="arrivalOrigin" class="form-control" maxlength="255" placeholder="Universidad, trabajo, centro comercial..."></div><div class="form-group"><label>Tiempo estimado</label><select id="arrivalMinutes" class="form-control"><option value="5">5 minutos</option><option value="10">10 minutos</option><option value="15" selected>15 minutos</option><option value="30">30 minutos</option><option value="45">45 minutos</option><option value="60">1 hora</option></select></div><div class="form-group"><label>Contacto de confirmación</label><input id="arrivalContact" class="form-control" maxlength="150" placeholder="Teléfono o contacto opcional"></div><button class="btn btn-solid span-2" type="submit"><i class="bi bi-geo-alt-fill"></i> Iniciar llegada segura</button></form></div><div class="panel"><div class="panel-head"><h3>Seguimiento activo</h3><button class="btn btn-ghost" id="reloadArrival" type="button">Actualizar</button></div><div id="arrivalActive"></div></div></div><div class="panel" style="margin-top:1rem"><div class="panel-head"><h3>Historial</h3><span class="badge neutral">TRAZABILIDAD</span></div><div id="arrivalHistory" class="queue-list"></div></div></div></div></div></div><script src="js/common.js"></script><script src="js/llegada-segura.js"></script></body></html>
